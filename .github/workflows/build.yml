name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install flet
      - run: flet build apk --project-name misa
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/apk/*.apk
